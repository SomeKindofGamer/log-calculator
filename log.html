<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Log Calculator / Wrote by Shoober</title>
    <script src="break_eternity.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #0d0d0d, #000);
            color: #eee;
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            background: #111;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(19, 180, 255, 0.511);
            transition: box-shadow 0.3s ease-in-out;
        }
        
        .container:hover {
            box-shadow: 0 0 60px rgba(0, 255, 247, 0.6);
        }
        
        input {
            width: 200px;
            padding: 12px;
            margin: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
            background: #222;
            color: #fff;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4);
            transition: box-shadow 0.2s;
        }
        
        input:focus {
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00ffc8, #0099ff);
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transition: all 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
        }
        
        .hint {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
        }
        
        .result {
            margin-top: 20px;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }
        
        @keyframes glowPulse {
            0% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
            }
            50% {
                text-shadow: 0 0 20px rgb(255, 255, 255);
            }
            100% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
            }
        }
        
        .animate {
            animation: glowPulse 0.6s ease-in-out;
            opacity: 1 !important;
        }
        
        .footer {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 14px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            font-style: italic;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Log Calculator!</h1>
        <div>
            <input type="text" id="base" placeholder="X (base)">
            <input type="text" id="number" placeholder="Number">
        </div>
        <button onclick="calculateLog()">Calculate</button>
        <div class="blank"> ㅤ </div>
        <div class="blank"> ㅤ </div>
        <div class="hint">You can also put in scientific notation! example: 1e1000 or 1e35</div>
        <div class="result" id="result"></div>
    </div>

    <div class="footer">v1.0 / Coded by Shoober</div>

    <script>
        function calculateLog() {
            const baseInput = document.getElementById("base").value.trim();
            const numberInput = document.getElementById("number").value.trim();
            const resultEl = document.getElementById("result");

            if (!baseInput || !numberInput) {
                resultEl.innerText = "";
                resultEl.classList.remove("animate");
                return;
            }

            try {
                const base = new Decimal(baseInput);
                const number = new Decimal(numberInput);

                // so you dont calculate negatives
                if (base.lte(1)) {
                    resultEl.innerText = "base must be > 1";
                } else if (number.lte(0)) {
                    resultEl.innerText = "number must be > 0";
                } else {
                    const logValue = Decimal.log(number, base);
                    resultEl.innerText = `log${base.toString()}(${number.toString()}) = ${logValue.toString()}`;
                }

                // reset the animation glowy thingy
                resultEl.classList.remove("animate");
                void resultEl.offsetWidth;
                resultEl.classList.add("animate");

            } catch (err) {
                resultEl.innerText = "invalid input";
                resultEl.classList.remove("animate");
            }
        }

        // updates every input change
        // cool very cool thing!
        document.getElementById("base").addEventListener("input", calculateLog);
        document.getElementById("number").addEventListener("input", calculateLog);
    </script>
</body>

</html>
